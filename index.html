<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <!-- استيراد Bootstrap للتصميم السريع العريض -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px 30px;
            margin-top: 100px;
            text-align: center;
        }
        .profile-name {
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-custom {
            margin: 5px;
            border-radius: 20px;
            padding: 10px 25px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 profile-card">
                <!-- اسمك -->
                <h1 class="profile-name">mohamed and hassan</h1>
                
                <!-- النبذة التعريفية -->
                <p class="lead mb-4">manger</p>
                
                <hr class="my-4">
                
                <h5 class="mb-3">تواصل معي:</h5>
                <div class="d-flex justify-content-center flex-wrap">
                    <!-- رابط التليغرام الخاص بك -->
                    <a href="https://t.me" target="_blank" class="btn btn-outline-primary btn-custom">تليغرام</a>
                </div>
                
                <footer class="mt-5">
                    <p style="color: #777; font-size: 0.9rem;">© 2026 جميع الحقوق محفوظة لـ mohamed and hassan</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
